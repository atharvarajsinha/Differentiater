[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "differentiater"
version = "1.0.0"
description = "File comparison and difference detection CLI built on a from-scratch Myers diff algorithm"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["diff", "myers", "file-comparison", "cli", "jupyter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["rich>=12"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
differentiater = "differentiater.cli:main"

[tool.setuptools.packages.find]
include = ["differentiater*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: larger performance-oriented tests"]
